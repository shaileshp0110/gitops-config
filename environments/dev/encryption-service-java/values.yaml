fullnameOverride: "encryption-service-java"
replicaCount: 1
image:
  repository: encryption-service-java
  tag: latest
  pullPolicy: Never
service:
  port: 8080
podSecurityContext: {}
securityContext: {}
livenessProbe:
  enabled: false
readinessProbe:
  enabled: false
env:
  - name: VAULT_ADDR
    value: "http://vault.vault.svc.cluster.local:8200"
  - name: VAULT_TOKEN
    value: "root"
  # Fallback key used when a request does not name one. Kept in step with the Node service.
  - name: KEY_NAME
    value: "demo-key-symmetric"
