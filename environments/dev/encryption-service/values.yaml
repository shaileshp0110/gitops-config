fullnameOverride: "encryption-service"
replicaCount: 1
image:
  repository: encryption-service
  tag: latest
  pullPolicy: Never
service:
  port: 3000
podSecurityContext: {}
securityContext: {}
# /status calls Vault and returns 500 when unreachable — not a liveness check.
livenessProbe:
  enabled: false
readinessProbe:
  enabled: false
env:
  - name: VAULT_ADDR
    value: "http://vault.vault.svc.cluster.local:8200"
  - name: VAULT_TOKEN
    value: "root"
  - name: KEY_NAME
    value: "demo-key"
