fullnameOverride: "encryption-service"
replicaCount: 1
image:
  repository: encryption-service
  tag: latest
  pullPolicy: Never
service:
  port: 3000
podSecurityContext: {}
securityContext: {}
# /status calls Vault and returns 500 when unreachable — not a liveness check.
livenessProbe:
  enabled: false
readinessProbe:
  enabled: false
env:
  - name: VAULT_ADDR
    value: "http://vault.vault.svc.cluster.local:8200"
  - name: VAULT_TOKEN
    value: "root"
  # Fallback key used when a request does not name one (e.g. GET /status). Must match a key
  # that exists in Vault's transit engine — the demo scripts pass explicit key names, so a
  # stale default here surfaces only as a 500 on /status.
  - name: KEY_NAME
    value: "demo-key-symmetric"
