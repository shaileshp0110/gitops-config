# Root app-of-apps for the local minikube cluster.
# Owns every Application manifest in clusters/local-cluster/ (vault, postgres,
# kube-prometheus-stack, frontend-dev, backend-dev, dev-environment), so a deleted
# child Application is recreated automatically.
# Istio is excluded — install it separately with infrastructure/setup-istio.sh.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-local
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/shaileshp0110/gitops-config.git
    path: clusters/local-cluster
    targetRevision: HEAD
    directory:
      exclude: "istio.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
