# Authorization model (default namespace):
#   1. deny-all — any meshed workload without an explicit ALLOW is rejected.
#   2. ALLOW policies — pin sources (namespace and/or SPIFFE principal) per path.
#
# Vault and postgres are NOT meshed; mesh authz does not govern their plaintext ports.
#
# IMPORTANT: source.namespaces and source.principals are read from the peer's mTLS
# certificate. A non-meshed client (the nginx addon, non-meshed Prometheus) has no peer
# identity, so those predicates never match its plaintext connections. Rules covering
# non-meshed sources must use source.ipBlocks instead — see mesh-local-ingress.yaml.

# Deny all inbound to meshed workloads unless explicitly allowed below.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: deny-all
  namespace: default
spec: {}
---
# Backend API from the frontend workload identity.
# Note: the frontend is a browser SPA, so in practice /api is reached through the edge
# proxy rather than pod-to-pod. In production, front the mesh with the Istio gateway and
# add its identity here:
#   - cluster.local/ns/istio-system/sa/istio-ingressgateway
# Locally the nginx addon is covered by mesh-local-ingress.yaml.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-to-backend
  namespace: default
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: backend-dev
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/default/sa/frontend-dev
      to:
        - operation:
            ports: ["3000"]
---
# backend -> encryption-service (Node). Requires dedicated service account on backend.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-to-encryption-service
  namespace: default
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: encryption-service-dev
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/default/sa/backend-dev
      to:
        - operation:
            ports: ["3000"]
---
# backend -> encryption-service-java
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-to-encryption-service-java
  namespace: default
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: encryption-service-java-dev
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/default/sa/backend-dev
      to:
        - operation:
            ports: ["8080"]
---
# Allow Prometheus (monitoring ns) to scrape istiod only — NOT the ingress gateway.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-prometheus-scrape-istiod
  namespace: istio-system
spec:
  selector:
    matchLabels:
      app: istiod
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces: ["monitoring"]
      to:
        - operation:
            ports: ["15014", "8080"]
---
# Allow Prometheus to scrape meshed app sidecars (Envoy stats on 15090).
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-prometheus-scrape-sidecars
  namespace: default
spec:
  selector:
    matchLabels:
      security.istio.io/tlsMode: istio
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces: ["monitoring"]
      to:
        - operation:
            ports: ["15090", "15020"]
---
# Application metrics: backend exposes /metrics on its own port (ServiceMonitor), which is
# a normal app port and therefore subject to deny-all.
# Two sources, OR'd: a meshed Prometheus matches by namespace; the local non-meshed
# Prometheus has no peer identity and matches only by pod CIDR. The rule is scoped to the
# /metrics path so this does not widen access to the API itself.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-prometheus-scrape-backend-metrics
  namespace: default
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: backend-dev
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces: ["monitoring"]
        - source:
            ipBlocks: ["10.244.0.0/16"]
      to:
        - operation:
            ports: ["3000"]
            paths: ["/metrics"]
