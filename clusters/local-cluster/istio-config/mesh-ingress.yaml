# North-south entry for myapp.local through the Istio ingress gateway.
#
# The gateway is meshed, so it reaches app pods over mTLS with its own identity
# (cluster.local/ns/istio-system/sa/istio-ingressgateway), which mesh-authz.yaml allows.
#
#   /api/* -> backend-dev:3000   (Node.js API)
#   /*     -> frontend-dev:80    (React SPA served by nginx)

# Bound to the istio-ingressgateway pods (label istio: ingressgateway, set by the
# gateway Helm release).
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: myapp-gateway
  namespace: default
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - myapp.local
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: myapp
  namespace: default
spec:
  hosts:
    - myapp.local
  gateways:
    - myapp-gateway
  http:
    - match:
        - uri:
            prefix: /api
      route:
        - destination:
            host: backend-dev
            port:
              number: 3000
    - route:
        - destination:
            host: frontend-dev
            port:
              number: 80
